name: TarotVision CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  backend-tests:
    name: Backend CV tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app_cv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -v

      - name: Compile Python files
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile main.py
          python -m compileall tarotvision

  frontend-build:
    name: Frontend AR build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app_ar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
